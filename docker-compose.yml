services:
  web:
    build: .
    ports:
      - "8000:8000"
      - "8001:8001"
    environment:
      PYTHONUNBUFFERED: "1"
      WEB_SEARCH_URL: ${WEB_SEARCH_URL:-http://searxng:8080/search}
    networks: [web, search]

  searxng:
    image: searxng/searxng:2026.9.18-0d6910ae5
    expose:
      - "8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks: [search]

networks:
  web:
  search:
