[project]
name = "agent-tools-web"
version = "0.1.0"
description = "REST web/search capabilities with a curated FastMCP projection."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "fastmcp>=4.0.0,<5",
  "httpx>=0.28,<1",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.13,<1",
]
